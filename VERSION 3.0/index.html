<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inicio | Sistema de Cursos</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Al cargar la página, verifica si el usuario está logueado
    window.onload = function() {
      const usuario = localStorage.getItem('usuario');
      if (usuario) {
        // Si hay usuario, redirige al dashboard (Mis Cursos)
        window.location.href = 'dashboard.html';
      } else {
        // Si no, redirige a la página de login
        window.location.href = 'login.html';
      }
    };
  </script>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center h-screen">
  <p class="text-lg">Redirigiendo, por favor espera...</p>

  <script src="script.js"></script>
  
</body>
</html>
